<!doctype html>
<html lang="zh-CN" data-page="teacher/cases.html">
<head>
  <meta charset="utf-8">
  <title>工单队列｜未来学习中心原型</title>
  <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
  <main>
    <h1>工单队列</h1>
    <p id="case-policy" class="case-notice"></p>
    <p id="case-feedback" role="status" aria-live="polite"></p>
    <div class="case-layout">
      <section class="case-panel" aria-labelledby="queue-heading">
        <h2 id="queue-heading">待办与处理结果</h2>
        <p id="case-count"></p>
        <ul id="case-list" class="case-list"></ul>
      </section>
      <section id="op" class="case-panel" aria-label="工单详情">
        <div id="case-detail"></div>
      </section>
    </div>
  </main>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages-data.js"></script>
  <script src="../assets/js/accounts.js"></script>
  <script src="../assets/js/guard.js"></script>
  <script src="../assets/js/feedback.js"></script>
  <script src="../assets/js/seeds.js"></script>
  <script src="../assets/js/boundary.js"></script>
  <script src="../assets/js/data/companion-scripts.js"></script>
  <script src="../assets/js/cases.js"></script>
  <script src="../assets/js/data/cases.js"></script>
  <script src="../assets/js/pages/cases.js"></script>
  <link rel="stylesheet" href="../assets/css/cases.css">
</body>
</html>
