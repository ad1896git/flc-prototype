<!doctype html>
<html lang="zh-CN" data-page="student/credentials.html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的证书｜未来学习中心原型</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/student-misc.css">
  <link rel="stylesheet" href="../assets/css/evidence-credentials.css">
</head>
<body>
  <main>
    <h1>我的证书</h1>
    <p class="misc-notice">以下为虚构证书样例，签发和验证均为示意。</p>
    <section id="credential-list-view" aria-labelledby="credential-list-title">
      <h2 id="credential-list-title">证书列表</h2>
      <div id="credential-list" class="misc-grid"></div>
    </section>
    <section id="credential-op-view" aria-label="证书详情和验证页示意" hidden>
      <p><a href="credentials.html">返回证书列表</a></p>
      <article id="credential-detail" class="credential-card"></article>
      <aside id="credential-verification" class="misc-notice" aria-labelledby="verification-title" hidden>
        <h2 id="verification-title">验证页（示意）</h2>
        <p>此处仅展示演示数据中的状态，未执行签名校验或查询真实状态列表。</p>
        <div id="verification-summary"></div>
      </aside>
    </section>
    <div class="flc-actions"><button id="export-clr" type="button">导出 CLR 打包</button></div>
    <p id="clr-status" role="status"></p>
  </main>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages-data.js"></script>
  <script src="../assets/js/accounts.js"></script>
  <script src="../assets/js/guard.js"></script>
  <script src="../assets/js/feedback.js"></script>
  <script src="../assets/js/seeds.js"></script>
  <script src="../assets/js/data/student-misc.js"></script>
  <script src="../assets/js/pages/credentials.js"></script>
</body>
</html>
